# Build the Libreta desktop app for every platform and attach the installers to a
# draft GitHub Release. Triggered by pushing a version tag (v1.2.3); can also be run
# by hand from the Actions tab. There is no server anywhere in this pipeline.
name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest      # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04      # .deb / .rpm / AppImage
            args: ''
          - platform: windows-latest    # .msi / .exe (NSIS)
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (WebKitGTK etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS runners build both architectures, so both targets are needed there.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install the Tauri CLI
        run: npm ci

      # A manual run from the Actions tab (no tag) only checks that every platform
      # still builds — nothing is released.
      - name: Build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Build and upload to the release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Libreta ${{ github.ref_name }}'
          releaseBody: |
            Libreta desktop — free, offline, no account.

            **macOS:** drag Libreta to Applications, then run this in Terminal once before opening it:
            `xattr -cr /Applications/Libreta.app`
            Without it macOS says the app "is damaged" — it isn't; that's what macOS shows for any app Apple hasn't notarised, which needs a paid developer account.

            **Windows:** choose *More info → Run anyway* on the SmartScreen prompt.

            **Linux:** make the AppImage executable, or install the .deb / .rpm.

            Full steps: https://josephdotdev.github.io/libreta-io/download.html#install

            See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
